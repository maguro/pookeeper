[project]
name = "pookeeper"
version = "0.1.0"
description = "Pure Python Zookeeper client bindings"
authors = [{ name = "Alan D. Cabrera", email = "adc@toolazydogs.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.txt"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.2.0,<10",
    "pytest-cov>=4.0.0,<5",
    "deptry>=0.16.2,<0.17",
    "mypy>=1.5.1,<2",
    "pre-commit>=3.4.0,<4",
    "testcontainers>=4.9.0,<5",
    "mockito>=1.5.3,<2",
    "setuptools>=78.1.1",
    "pytest-timeout>=2.3.1,<3",
]
docs = [
    "mkdocs>=1.4.2,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=0.26.1,<0.27",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
files = ["cookiecutter_poetry_example"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 180
timeout = 300
timeout_method = "signal"

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["pookeeper"]
